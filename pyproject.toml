[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaysync"
version = "0.1.0"
description = "RelaySync: Sistem Pemantau Transisi dan Jarak Lari Estafet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt==2.1.0",
    "PyYAML>=6.0,<7",
    "certifi",
]

[project.optional-dependencies]
dashboard = [
    "streamlit==1.40.2",
    "pandas>=2.0,<3",
]
dev = ["ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
relaysync-edge = "relaysync.apps.edge_cli:main"
relaysync-engine = "relaysync.apps.engine_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/relaysync"]
exclude = ["src/relaysync/dashboard"]
